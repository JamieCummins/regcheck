<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RegCheck software workflow diagram</title>
  <desc id="desc">Architecture diagram showing RegCheck entry points, web orchestration, comparison services, retrieval-augmented comparison engine, and outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .lane-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .lane { stroke-width: 2; rx: 24; ry: 24; }
      .box { stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #64748b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="58" text-anchor="middle" class="title">RegCheck Software Workflow</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">FastAPI web app + CLI frontend feeding a retrieval-augmented, dimension-level comparison pipeline</text>

  <rect x="40" y="120" width="240" height="640" fill="#eff6ff" stroke="#93c5fd" class="lane"/>
  <rect x="310" y="120" width="270" height="640" fill="#ecfdf5" stroke="#86efac" class="lane"/>
  <rect x="610" y="120" width="320" height="640" fill="#fffbeb" stroke="#fcd34d" class="lane"/>
  <rect x="960" y="120" width="280" height="640" fill="#fdf4ff" stroke="#d8b4fe" class="lane"/>
  <rect x="1270" y="120" width="290" height="640" fill="#eef2ff" stroke="#a5b4fc" class="lane"/>

  <text x="160" y="155" text-anchor="middle" class="lane-title">Entry Points</text>
  <text x="445" y="155" text-anchor="middle" class="lane-title">Web Orchestration</text>
  <text x="770" y="155" text-anchor="middle" class="lane-title">Comparison Services</text>
  <text x="1100" y="155" text-anchor="middle" class="lane-title">RAG Comparison Engine</text>
  <text x="1415" y="155" text-anchor="middle" class="lane-title">Outputs</text>

  <rect x="65" y="185" width="190" height="102" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="160" y="214" text-anchor="middle" class="box-title">Browser UI</text>
  <text x="160" y="239" text-anchor="middle" class="box-text">Upload files, choose</text>
  <text x="160" y="259" text-anchor="middle" class="box-text">dimensions, parser,</text>
  <text x="160" y="279" text-anchor="middle" class="box-text">and LLM provider</text>

  <rect x="65" y="345" width="190" height="82" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="160" y="374" text-anchor="middle" class="box-title">CLI</text>
  <text x="160" y="399" text-anchor="middle" class="box-text">Batch runs with</text>
  <text x="160" y="419" text-anchor="middle" class="box-text">CSV-defined dimensions</text>

  <rect x="345" y="175" width="200" height="92" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="445" y="205" text-anchor="middle" class="box-title">FastAPI + Jinja</text>
  <text x="445" y="230" text-anchor="middle" class="box-text">Routes: `/compare`,</text>
  <text x="445" y="250" text-anchor="middle" class="box-text">`/task_status`, `/result`</text>

  <rect x="345" y="325" width="200" height="92" fill="#e5e7eb" stroke="#475569" class="box"/>
  <text x="445" y="355" text-anchor="middle" class="box-title">Redis</text>
  <text x="445" y="380" text-anchor="middle" class="box-text">Job queue plus</text>
  <text x="445" y="400" text-anchor="middle" class="box-text">progress/result state</text>

  <rect x="345" y="500" width="200" height="92" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="445" y="530" text-anchor="middle" class="box-title">Background Worker</text>
  <text x="445" y="555" text-anchor="middle" class="box-text">Restores uploads and</text>
  <text x="445" y="575" text-anchor="middle" class="box-text">dispatches comparison jobs</text>

  <rect x="345" y="650" width="200" height="74" fill="#f8fafc" stroke="#64748b" class="box"/>
  <text x="445" y="679" text-anchor="middle" class="box-title">Optional S3</text>
  <text x="445" y="704" text-anchor="middle" class="box-text">Temporary upload handoff</text>

  <rect x="640" y="170" width="260" height="86" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="770" y="200" text-anchor="middle" class="box-title">Comparison Services</text>
  <text x="770" y="225" text-anchor="middle" class="box-text">`general` / `clinical` / `animals`</text>

  <rect x="640" y="320" width="260" height="112" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="770" y="350" text-anchor="middle" class="box-title">Registration Text Assembly</text>
  <text x="770" y="375" text-anchor="middle" class="box-text">Uploaded preregistration,</text>
  <text x="770" y="395" text-anchor="middle" class="box-text">historical ClinicalTrials.gov</text>
  <text x="770" y="415" text-anchor="middle" class="box-text">version, or PCT CSV input</text>

  <rect x="640" y="490" width="260" height="132" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="770" y="520" text-anchor="middle" class="box-title">Paper Text Extraction</text>
  <text x="770" y="545" text-anchor="middle" class="box-text">GROBID / DPT-2 / DOCX</text>
  <text x="770" y="565" text-anchor="middle" class="box-text">with scanned-PDF fallback</text>
  <text x="770" y="590" text-anchor="middle" class="box-title">Optional Focus Step</text>
  <text x="770" y="615" text-anchor="middle" class="box-text">LLM isolates the relevant</text>
  <text x="770" y="635" text-anchor="middle" class="box-text">experiment in multi-study papers</text>

  <rect x="985" y="265" width="230" height="102" fill="#f3e8ff" stroke="#a855f7" class="box"/>
  <text x="1100" y="294" text-anchor="middle" class="box-title">Chunk + Embed Corpora</text>
  <text x="1100" y="319" text-anchor="middle" class="box-text">Sentence-aware chunking</text>
  <text x="1100" y="339" text-anchor="middle" class="box-text">and OpenAI embeddings</text>
  <text x="1100" y="359" text-anchor="middle" class="box-text">for registration and paper</text>

  <rect x="985" y="430" width="230" height="102" fill="#f3e8ff" stroke="#a855f7" class="box"/>
  <text x="1100" y="459" text-anchor="middle" class="box-title">Per-Dimension Retrieval</text>
  <text x="1100" y="484" text-anchor="middle" class="box-text">Embed the dimension query</text>
  <text x="1100" y="504" text-anchor="middle" class="box-text">and retrieve top-k paper</text>
  <text x="1100" y="524" text-anchor="middle" class="box-text">and registration chunks</text>

  <rect x="985" y="595" width="230" height="102" fill="#fce7f3" stroke="#db2777" class="box"/>
  <text x="1100" y="624" text-anchor="middle" class="box-title">Structured Comparison LLM</text>
  <text x="1100" y="649" text-anchor="middle" class="box-text">OpenAI / Groq / DeepSeek</text>
  <text x="1100" y="669" text-anchor="middle" class="box-text">returns JSON summaries,</text>
  <text x="1100" y="689" text-anchor="middle" class="box-text">quotes, and deviation calls</text>

  <rect x="1305" y="250" width="220" height="92" fill="#e0e7ff" stroke="#4f46e5" class="box"/>
  <text x="1415" y="280" text-anchor="middle" class="box-title">Results UI</text>
  <text x="1415" y="305" text-anchor="middle" class="box-text">Browser polls Redis for</text>
  <text x="1415" y="325" text-anchor="middle" class="box-text">task status and final report</text>

  <rect x="1305" y="430" width="220" height="92" fill="#e0e7ff" stroke="#4f46e5" class="box"/>
  <text x="1415" y="460" text-anchor="middle" class="box-title">Report JSON</text>
  <text x="1415" y="485" text-anchor="middle" class="box-text">Dimension-level quotes,</text>
  <text x="1415" y="505" text-anchor="middle" class="box-text">summaries, and judgement</text>

  <rect x="1305" y="580" width="220" height="74" fill="#e0e7ff" stroke="#4f46e5" class="box"/>
  <text x="1415" y="609" text-anchor="middle" class="box-title">CLI Export</text>
  <text x="1415" y="634" text-anchor="middle" class="box-text">CSV or JSON output</text>

  <rect x="1305" y="695" width="220" height="62" fill="#eef2ff" stroke="#818cf8" class="box"/>
  <text x="1415" y="722" text-anchor="middle" class="box-title">Optional Survey</text>
  <text x="1415" y="744" text-anchor="middle" class="box-text">Stored separately</text>

  <path d="M255 236 H345" class="arrow"/>
  <path d="M445 267 V325" class="arrow"/>
  <path d="M445 417 V500" class="arrow"/>
  <path d="M255 386 C400 386, 470 213, 640 213" class="arrow"/>
  <path d="M545 221 C595 221, 595 687, 545 687" class="arrow-dashed"/>
  <path d="M445 650 V592" class="arrow-dashed"/>
  <path d="M545 546 H640" class="arrow"/>
  <path d="M770 256 V320" class="arrow"/>
  <path d="M900 556 H985" class="arrow"/>
  <path d="M900 376 C945 376, 950 316, 985 316" class="arrow"/>
  <path d="M1215 316 V430" class="arrow"/>
  <path d="M1215 532 V595" class="arrow"/>
  <path d="M545 371 C820 371, 1095 295, 1305 295" class="arrow"/>
  <path d="M1215 646 C1250 646, 1260 476, 1305 476" class="arrow"/>
  <path d="M1415 522 V580" class="arrow"/>
  <path d="M1415 342 V695" class="arrow-dashed"/>

  <text x="505" y="298" class="label">enqueue job</text>
  <text x="458" y="462" class="label">dequeue</text>
  <text x="335" y="370" class="label">direct call</text>
  <text x="1226" y="385" class="label">dimension loop</text>
  <rect x="65" y="790" width="1460" height="78" fill="#f8fafc" stroke="#cbd5e1" class="box"/>
  <text x="95" y="820" class="box-title">Notes</text>
  <text x="95" y="845" class="note">Web path: FastAPI stores uploads, enqueues a job in Redis, and the worker updates progress/result state. CLI path bypasses Redis and calls the same comparison services directly.</text>
  <text x="95" y="865" class="note">Optional S3 is used for temporary upload handoff when web and worker run on separate dynos.</text>
</svg>
