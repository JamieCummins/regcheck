# Correctness gate, not a style linter: syntax errors (E9), broken comparisons
# (F63), late-binding/syntax misuse (F7), undefined names (F82), and silent
# redefinitions (F811 — a shadowed module-level name has bitten this codebase).
# Style rules are intentionally out of scope for CI.
target-version = "py312"

[lint]
select = ["E9", "F63", "F7", "F82", "F811"]
