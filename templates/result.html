<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    {% set static_version = '20260611-tracing' %}
    {% include '_partials/head_assets.html' %}
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="RegCheck is an AI tool to compare preregistrations with papers instantly."/>
    <meta name="robots" content="noindex,nofollow">
    <meta name="author" content="Jamie Cummins">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegCheck Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/report.css') }}?v={{ static_version }}">
</head>
<body class="text-bg-dark report-page page-shell">
    <div class="report-shell">
        <header class="report-header">
            {% include '_partials/navbar.html' %}
            <div class="report-topbar">
                <div class="report-topbar__lead">
                    <h1 id="results-page-tagline">RegCheck Report</h1>
                    <span class="report-status-pill" id="report-status-pill" aria-live="polite" title="">
                        <span class="report-status-pill__dot" id="report-status-dot"></span>
                        <span id="report-status-text">Processing</span>
                    </span>
                </div>
                <div class="report-actions">
                    <button type="button" class="report-action-btn report-action-btn--primary" id="copy-report-link-btn">
                        <svg class="report-action-btn__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                        <span id="copy-report-link-label">Share</span>
                    </button>
                    <button type="button" class="report-action-btn report-action-btn--ghost" id="download-report-csv-btn">
                        <svg class="report-action-btn__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <path d="M7 10l5 5 5-5"/>
                            <path d="M12 15V3"/>
                        </svg>
                        <span>Export CSV</span>
                    </button>
                </div>
            </div>
            <div id="report-log" class="report-log d-none" aria-live="polite">
                <div class="report-log__head">
                    <span class="report-log__title">
                        <span class="report-log__spinner" aria-hidden="true"></span>
                        Generating report
                    </span>
                    <span id="report-log-progress" class="report-log__progress"></span>
                </div>
                <ol id="report-log-list" class="report-log__list"></ol>
            </div>
        </header>

        <main id="report-app" class="report-workspace" data-task-id="{{ task_id }}">
            <div id="view-decision" class="report-view report-view--decision">
                <aside class="report-dimension-rail" aria-label="Dimensions">
                    <div class="rail-heading">
                        <span>Dimensions</span>
                        <span id="dimension-count" class="rail-count">0</span>
                    </div>
                    <div id="dimension-list" class="dimension-list"></div>
                </aside>

                <section class="report-detail" aria-label="Report detail">
                    <div id="report-empty-state" class="report-empty-state">
                        <span class="report-empty-state__spinner" aria-hidden="true"></span>
                        <p>Preparing your report&hellip;</p>
                    </div>
                    <article id="dimension-detail" class="dimension-detail d-none"></article>
                </section>

                <aside class="report-quotes" aria-label="Evidence quotes">
                    <div id="quotes-pane" class="quotes-pane"></div>
                </aside>
            </div>

            <section id="view-documents" class="report-view report-view--documents d-none" aria-label="Source documents"></section>
        </main>

        {% include '_partials/footer.html' %}
    </div>

    <div id="report-toast" class="report-toast" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}?v={{ static_version }}"></script>
    <script src="{{ url_for('static', path='js/quote-locator.js') }}?v={{ static_version }}"></script>
    <script src="{{ url_for('static', path='js/report.js') }}?v={{ static_version }}"></script>
</body>
</html>
